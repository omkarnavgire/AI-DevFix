spring.application.name=ai-devfix
server.port=${PORT:8080}
server.error.include-message=never
spring.jackson.default-property-inclusion=non_null

# Nebius Token Factory OpenAI-compatible endpoint
nebius.api.base-url=${NEBIUS_API_BASE_URL:https://api.tokenfactory.nebius.com/v1}
nebius.api.key=${NEBIUS_API_KEY:}
nebius.model=${NEBIUS_MODEL:nvidia/Nemotron-3_5-Lightning}
nebius.timeout-seconds=${NEBIUS_TIMEOUT_SECONDS:90}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
logging.level.org.springframework.web=INFO
